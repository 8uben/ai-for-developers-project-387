name: Lighthouse Report

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Install Lighthouse CLI
        run: npm install -g lighthouse

      - name: Run Lighthouse audit
        run: |
          mkdir -p reports
          lighthouse https://call-booking-4je6.onrender.com \
            --chrome-flags="--headless --no-sandbox --disable-gpu" \
            --output=html \
            --output-path=./reports/lighthouse-report.html \
            --quiet

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: ./reports/lighthouse-report.html
          retention-days: 90

      - name: Post summary to workflow
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          # Lighthouse Report

          **URL:** https://call-booking-4je6.onrender.com

          **Report saved as artifact** — download the HTML file and open in any browser.

          ## What to check

          1. Open the downloaded `lighthouse-report.html` in a browser
          2. Review scores for Performance, Accessibility, Best Practices, SEO
          3. Check opportunities and diagnostics sections for recommendations
          4. Decide which fixes to apply

          <sup>Generated by Lighthouse CI — $(date -u)</sup>
          EOF
